<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Cookbook | Discover Exquisite Recipes</title>
    <meta name="description"
        content="Explore a curated collection of exquisite recipes from around the world. Elevate your culinary skills with Gourmet Cookbook.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="container header-content">
            <h1 class="logo">Eve's and Tivvit's<span>Family Recipes</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="#" class="active">Discover</a></li>
                    <li><a href="#">Categories</a></li>
                    <li><a href="#">My Favorites</a></li>
                </ul>
            </nav>
            <button class="btn-primary" id="addRecipeBtn">Add Recipe</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-text">
                <h2>Favorite Recipes</h2>
                <p>Discover, create, and share favorite recipes from the family.</p>
                <div class="search-bar glass-panel">
                    <input type="text" placeholder="Search for recipes, or ingredients..." id="searchInput">
                    <button id="searchBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="recipes-grid" id="recipesGrid">
            <!-- Recipe cards will be injected here by JS -->
        </section>
    </main>

    <!-- Add Recipe Modal -->
    <div id="addRecipeModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Add New Recipe</h2>
                <button class="close-btn" id="closeAddModal">&times;</button>
            </div>
            <form id="addRecipeForm">
                <div class="form-group">
                    <label for="recipeTitle">Title</label>
                    <input type="text" id="recipeTitle" required placeholder="e.g., Grandma's Apple Pie">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="recipeAuthor">Author</label>
                        <input type="text" id="recipeAuthor" required placeholder="e.g., Jane Doe">
                    </div>
                    <div class="form-group">
                        <label for="recipeCategory">Category</label>
                        <input type="text" id="recipeCategory" required placeholder="e.g., Dessert">
                    </div>
                    <div class="form-group">
                        <label for="recipeTime">Time</label>
                        <input type="text" id="recipeTime" required placeholder="e.g., 1h 20m">
                    </div>
                </div>
                <div class="form-group">
                    <label for="recipeImage">Image URL (Optional)</label>
                    <input type="url" id="recipeImage" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label for="recipeDesc">Description</label>
                    <textarea id="recipeDesc" required placeholder="A short description of this delicious recipe..." rows="2"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Ingredients</label>
                    <div id="ingredientsList">
                        <div class="ingredient-row">
                            <input type="text" class="ing-amount" placeholder="e.g. 2" required>
                            <input type="text" class="ing-unit" placeholder="e.g. cups">
                            <input type="text" class="ing-name" placeholder="e.g. Flour" required>
                            <button type="button" class="remove-row-btn">&times;</button>
                        </div>
                    </div>
                    <button type="button" id="addIngredientBtn" class="btn-secondary">+ Add Ingredient</button>
                </div>

                <div class="form-group">
                    <label>Steps</label>
                    <div id="stepsList">
                        <div class="step-row">
                            <span class="step-number">1.</span>
                            <textarea class="step-desc" placeholder="Preheat the oven to 350°F..." required rows="1"></textarea>
                            <button type="button" class="remove-row-btn">&times;</button>
                        </div>
                    </div>
                    <button type="button" id="addStepBtn" class="btn-secondary">+ Add Step</button>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelAddBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Recipe Modal -->
    <div id="viewRecipeModal" class="modal-overlay">
        <div class="modal-content glass-panel view-modal">
            <div class="modal-header">
                <h2 id="viewTitle">Recipe Title</h2>
                <button class="close-btn" id="closeViewModal">&times;</button>
            </div>
            <div class="view-recipe-body">
                <div class="view-recipe-meta" id="viewMeta">
                    <!-- Author, Category, Time injected here -->
                </div>
                <p id="viewDesc" class="view-desc"></p>
                
                <div class="recipe-layout">
                    <div class="ingredients-section">
                        <h3>Ingredients</h3>
                        <ul id="viewIngredients" class="ingredients-list">
                            <!-- Ingredients injected here -->
                        </ul>
                    </div>
                    <div class="steps-section">
                        <h3>Instructions</h3>
                        <ol id="viewSteps" class="steps-list">
                            <!-- Steps injected here -->
                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
