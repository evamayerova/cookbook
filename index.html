<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Cookbook | Discover Eve and Tivvit's Recipes</title>
    <meta name="description" content="Explore a curated collection of recipes which we both love.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="container header-content">
            <h1 class="logo">Eve's and Tivvit's <span>Family Recipes</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="#" class="active">Discover</a></li>
                    <li>
                        <button id="cookModeBtn" class="btn-cook-mode" title="Keep screen awake while cooking" aria-label="Toggle Cook Mode">
                            <span class="cook-icon">🍳</span>
                            <span class="cook-text">Cook Mode</span>
                            <span class="cook-status-dot"></span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-text">
                <h2>Favorite Recipes</h2>
                <p>Discover and share our favorite recipes.</p>
                <div class="search-bar glass-panel">
                    <input type="text" placeholder="Search for recipes, or ingredients..." id="searchInput">
                    <button id="searchBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>

                <div class="filter-bar glass-panel">
                    <select id="categoryFilter" class="filter-select">
                        <option value="All">All Categories</option>
                    </select>

                    <select id="timeFilter" class="filter-select">
                        <option value="All">Any Duration</option>
                        <option value="30">30 min or less</option>
                        <option value="60">60 min or less</option>
                    </select>

                    <label class="favorite-toggle">
                        <input type="checkbox" id="favoriteFilter">
                        <span class="toggle-text">Show Favorites Only</span>
                    </label>
                </div>
            </div>
        </section>

        <section class="recipes-grid" id="recipesGrid">
            <!-- Recipe cards will be injected here by JS -->
        </section>
    </main>



    <script src="recipes-data.js"></script>
    <script src="script.js"></script>
</body>

</html>
