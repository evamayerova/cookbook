<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Cookbook | Recipe Details</title>
    <meta name="description"
        content="Read full recipe details and instructions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="glass-header">
        <div class="container header-content">
            <h1 class="logo">Eve's and Tivvit's<span>Family Recipes</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Discover</a></li>
                    <li><a href="#">Categories</a></li>
                    <li><a href="#">My Favorites</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="btn-back">← Back to recipes</a>
        
        <div id="recipeDetailContainer" class="glass-panel full-page-recipe" style="display: none;">
            <div class="recipe-header-full">
                <div class="recipe-image-full" id="pageImageContainer">
                    <!-- Image injected here -->
                </div>
                <div class="recipe-title-section">
                    <h2 id="pageTitle">Recipe Title</h2>
                    <div class="view-recipe-meta" id="pageMeta">
                        <!-- Author, Category, Time injected here -->
                    </div>
                    <p id="pageDesc" class="view-desc"></p>
                </div>
            </div>

            <div class="recipe-layout">
                <div class="ingredients-section">
                    <h3>Ingredients</h3>
                    <ul id="pageIngredients" class="ingredients-list">
                        <!-- Ingredients injected here -->
                    </ul>
                </div>
                <div class="steps-section">
                    <h3>Instructions</h3>
                    <ol id="pageSteps" class="steps-list">
                        <!-- Steps injected here -->
                    </ol>
                </div>
            </div>
        </div>
        <div id="recipeNotFound" style="display: none; text-align: center; padding: 4rem;">
            <h2>Recipe not found</h2>
            <p>The recipe you are looking for doesn't exist or has been removed.</p>
        </div>
    </main>

    <script src="recipes-data.js"></script>
    <script src="script.js"></script>
</body>

</html>
